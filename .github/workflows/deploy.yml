name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t multimodal-rag:latest .

      - name: Smoke test container
        run: |
          docker run -d --name rag-api -p 8000:8000 multimodal-rag:latest
          sleep 15
          curl -f http://localhost:8000/health
          docker stop rag-api
